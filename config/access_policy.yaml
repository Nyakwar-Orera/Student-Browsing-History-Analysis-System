# ============================================================
# MamalBrowse Sentinel " Authoritative Access Policy
# ============================================================
# Comprehensive Universal Institutional Policy
# Effective Date: October 31, 2026
#
# POLICY PRINCIPLES:
#  1. SENIOR DARAJAH (Std 8-11) INSTITUTIONAL DIRECTIVE:
#     - Senior students (Darajah 8-11) have designated personal laptops.
#     - Lab workstation accounts remain locked & disabled for seniors.
#  2. DARAJAH 1-7 FRESH START & POLICY RESET:
#     - Once an account is enabled (via Active Directory or Sentinel system),
#       all previous disabled reasons, warnings, and violations are cleared.
#     - The system will NOT disable the account again for historical activity.
#     - Accounts can ONLY be disabled if the student commits fresh policy
#       violations after their account has been enabled (effective Oct 31, 2026).
#  3. YOUTUBE ACCESS, SHORTS & TIME-PASSING:
#     - Educational curriculum videos and Bohra community videos (Aljamea, waaz,
#       bayan, sabaq, marsiya, madeh, Quran hifz/tilawat, Syedna, Burhani) are
#       completely permitted and non-punishable.
#     - YouTube Shorts (/shorts/, #shorts) are strictly BLOCKED on lab workstations.
#     - Watching movies / entertainment videos on YouTube is treated as time-passing:
#       students receive clear live time-passing warnings. Persisting after repeated
#       warnings triggers progressive disciplinary action, but never immediate auto-block.
#  4. PINTEREST PERMITTED (CURRICULUM & DESIGN RESOURCE):
#     - pinterest.com, uk.pinterest.com, and all related domains are explicitly permitted for academic design research.
#  5. FAIR AD REDIRECT & TRANSIENT PROTECTION:
#     - When a student is directed by ads or popups, it DOES NOT count as a violation.
#     - Students must close ad/popup tabs instantly.
#     - Accidental popups or ad redirects with minimal dwell time never disable an account.
#  6. BROWSER BOOKMARKS EXEMPTION:
#     - Any educational or curriculum site in the student's browser bookmarks
#       must NEVER lead to account disability or penalty strikes.
#  7. PERMITTED LAB OPERATIONAL HOURS:
#     - Monday through Saturday: 08:00 to 21:30 (8:00 AM " 9:30 PM)
#     - Sunday: 10:00 to 17:00 (10:00 AM " 5:00 PM)
# ============================================================

