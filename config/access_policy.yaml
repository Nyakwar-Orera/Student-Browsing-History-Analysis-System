session_time_limits:
  darajah_1: 30
  darajah_2: 30
  darajah_3: 30
  darajah_4: 30
  darajah_5: 60
  darajah_6: 60
  darajah_7: 60
  darajah_8: 120
  darajah_9: 120
  darajah_10: 120
  darajah_11: 120
  darajah_12: 120
  igcse: 120
  dars_burhani: 60
  default: 60
session_warning_threshold_minutes: 5
auto_expire_account_on_timeout: true

email_alerts:
  enabled: false                      # Q3: dashboard-only, no emails
  recipients: []
  digest_interval_seconds: 3600
  immediate_alert_categories: []

browser_enforcement:
  enabled: true
  allowed_browsers:
  - chrome.exe
  action_on_unauthorized: block
  message: Only Google Chrome is permitted on lab workstations.

default_action: allow

# ── Account lock ─────────────────────────────────────────────
# Manual suspensions only per institutional policy (Q1 2026-10-02).
account_lock:
  enabled: false
  auto_block_categories: []
  max_warnings_before_block: 3       # 3 strikes for other categories

